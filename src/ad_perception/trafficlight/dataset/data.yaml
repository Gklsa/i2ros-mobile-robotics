# Ultralytics YOLO dataset config. train.txt/val.txt are generated by
# ../training/split_yolo_dataset.py. The path is relative to this file;
# adjust it if you move the dataset.
path: .
train: train.txt
val: val.txt

names:
  0: red
  1: yellow
  2: green
  3: traffic_light  # the housing/frame itself, independent of which bulb is lit
